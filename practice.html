<section>
<h2>Day 1: Model the cost first</h2>
<ol>
<li><p>Musamir decodes one visitor's answer alone on the L4 at about 74 ms a token. Yamen proposes a card with twice the TFLOPS and the same memory bandwidth. What happens to the time per token?</p><ul><li><b>A.</b> It halves, to about 37 ms</li><li><b>B.</b> It barely changes: decode waits on reading the weights</li><li><b>C.</b> It rises, because prefill takes more of each step</li><li><b>D.</b> It falls only if the card has more memory</li></ul></li>
<li><p>Another team serves a model with 32 layers, 32 query heads and 8 key-value heads of size 128, with a 16-bit cache, and has 4.2 GB left for the cache. About how many 4,000-token conversations fit at once?</p><ul><li><b>A.</b> About 16</li><li><b>B.</b> About 2</li><li><b>C.</b> About 4</li><li><b>D.</b> About 8</li></ul></li>
<li><p>A run at 16 users shows a mean TTFT of 1.7 s, a p90 TTFT of 9 s, a TPOT p90 of 95 ms, no stall over 1 s and 0.44 requests per second. Hanadi asks whether the objective is met. What do you report?</p><ul><li><b>A.</b> Yes: the mean TTFT is under 2 s</li><li><b>B.</b> Yes: it serves 0.44 requests per second</li><li><b>C.</b> The share of requests that met all three, which the TTFT p90 says is under 90%</li><li><b>D.</b> Yes: the TPOT p90 is under 150 ms</li></ul></li>
<li><p>At 8 users, one run with a new engine setting gives a p90 TTFT of 1.5 s against the baseline's 1.96 s mean (sd 0.68 over three runs). What do you conclude?</p><ul><li><b>A.</b> Nothing yet: the gap is inside the baseline's spread; run three repeats</li><li><b>B.</b> The setting cuts TTFT by a quarter</li><li><b>C.</b> It is better because throughput did not drop</li><li><b>D.</b> The setting is worse: the result is noisy</li></ul></li>
<li><p>A 7B model in 16 bits decodes one sequence on a card with 400 GB/s of bandwidth reached at 80%. About how long is one decode step, ignoring the cache?</p><ul><li><b>A.</b> About 4 ms</li><li><b>B.</b> About 44 ms</li><li><b>C.</b> About 88 ms</li><li><b>D.</b> About 22 ms</li></ul></li>
<li><p>A visitor pastes a 6,000-token event terms document. Which resource mostly sets the time to its first token on Musamir's L4?</p><ul><li><b>A.</b> The accelerator's arithmetic rate</li><li><b>B.</b> The network between the visitor and the node</li><li><b>C.</b> Memory bandwidth, because the weights are read for every token</li><li><b>D.</b> The size of the cache</li></ul></li>
<li><p>A model has 40 layers, 40 query heads and 8 key-value heads of size 128, with a 16-bit cache. How many bytes of cache does one token take?</p><ul><li><b>A.</b> 819,200 bytes</li><li><b>B.</b> 81,920 bytes</li><li><b>C.</b> 40,960 bytes</li><li><b>D.</b> 163,840 bytes</li></ul></li>
<li><p>Your prediction says 18 conversations of 2,000 tokens fit; the engine holds 12 and preempts. The model and length are right. What did the prediction most likely leave out?</p><ul><li><b>A.</b> The speed of the accelerator</li><li><b>B.</b> The query heads</li><li><b>C.</b> The engine's reserve for activations and the memory-utilisation limit</li><li><b>D.</b> The tokenizer's vocabulary</li></ul></li>
<li><p>Musamir in 16 bits holds about 12 conversations of 2,000 tokens, and decoding reaches the ridge point only at about 246 sequences. What binds the baseline's concurrency?</p><ul><li><b>A.</b> The sequence cap of the engine</li><li><b>B.</b> Cache memory: the batch never grows enough to use the arithmetic</li><li><b>C.</b> The network bandwidth</li><li><b>D.</b> Arithmetic: the card is too slow</li></ul></li>
<li><p>In 100 seconds an engine finishes 60 requests; 45 met the whole objective (TTFT, TPOT and stall), 10 missed only the TPOT limit, 5 missed only the TTFT limit. What is the goodput?</p><ul><li><b>A.</b> 0.45 requests per second</li><li><b>B.</b> 0.60 requests per second</li><li><b>C.</b> 0.55 requests per second</li><li><b>D.</b> 0.50 requests per second</li></ul></li>
<li><p>Two configurations have the same mean TTFT of 1.4 s. A has a p90 of 1.9 s, B a p90 of 4.2 s. Against Musamir's objective, which serves visitors better?</p><ul><li><b>A.</b> Neither can be judged without throughput</li><li><b>B.</b> They are equal: the means are the same</li><li><b>C.</b> B, because its spread shows it handles bursts</li><li><b>D.</b> A: more of its requests meet the 2.0 s objective</li></ul></li>
<li><p>A curve shows throughput rising from 0.25 to 0.44 requests per second between 4 and 16 users, while goodput falls from 0.23 to 0.00. Where should the engine be run?</p><ul><li><b>A.</b> Anywhere: the objective is met on average</li><li><b>B.</b> At 16 users, where throughput is highest</li><li><b>C.</b> Near 4 users, with admission control holding it there</li><li><b>D.</b> At 1 user, where every request meets the objective</li></ul></li>
<li><p>One run of a new setting gives a p90 TTFT 0.3 s lower than the baseline, whose three runs spread by 0.6 s. What do you report?</p><ul><li><b>A.</b> An improvement of 0.3 s</li><li><b>B.</b> No difference established yet; repeat the new setting three times</li><li><b>C.</b> A regression, because the result is noisy</li><li><b>D.</b> An improvement, because throughput held</li></ul></li>
<li><p>Why can a closed-loop test at 16 users look survivable when the real evening peak is not?</p><ul><li><b>A.</b> Closed-loop users wait for each answer, so the load eases when the engine slows</li><li><b>B.</b> Closed-loop tests use shorter prompts</li><li><b>C.</b> Open-loop tests add network delay</li><li><b>D.</b> Closed-loop tests skip the warm-up</li></ul></li>
</ol>
</section>
<section>
<h2>Day 2: Scheduling and caching in the engine</h2>
<ol>
<li><p>Kenan reads the Day 1 curve and says: "throughput keeps rising to 16 users, so the engine has headroom; let us admit more visitors." What is wrong with the argument?</p><ul><li><b>A.</b> The curve has too few runs to say anything</li><li><b>B.</b> A closed loop cannot measure throughput</li><li><b>C.</b> Throughput counts requests finished, met or not; past 4 users goodput falls</li><li><b>D.</b> Throughput only counts at the evening peak</li></ul></li>
<li><p>A deployment misses the objective at 10 visitors. Its gauges: 10 running, 6 waiting, cache 97% in use, preemptions climbing. Yamen wants to double the sequence cap. What do you tell him?</p><ul><li><b>A.</b> Do not raise the cap: the cache is the limit; lower the cap or free memory for the cache</li><li><b>B.</b> Raise it: six requests are waiting</li><li><b>C.</b> Keep the cap and halve the token budget</li><li><b>D.</b> Rerun with a different load generator first</li></ul></li>
<li><p>Asrar reports that English chat answers freeze for about a second, several times an evening, while TPOT p90 stays at 110 ms. Chunked prefill is on with a budget of 8,192 tokens. What is the most likely cause?</p><ul><li><b>A.</b> Decoding is too slow for English</li><li><b>B.</b> The cache is full and answers are preempted</li><li><b>C.</b> The sequence cap is too low</li><li><b>D.</b> The budget is so large that a whole long prompt still fits in one step</li></ul></li>
<li><p>Product wants Musamir to greet each visitor by first name, so the name must be in the prompt. Prefix caching and a salt per tenant are on. Where should the name go?</p><ul><li><b>A.</b> At the start: the salt keeps it private</li><li><b>B.</b> After everything shared, next to the question</li><li><b>C.</b> Inside the tenant's rules, so each tenant handles it</li><li><b>D.</b> Nowhere: names cannot be used with a prefix cache</li></ul></li>
<li><p>The vendor answers Hanadi: "If wrong answers worry you, raise the threshold to 0.95." What does Lab 2.4's data say about that?</p><ul><li><b>A.</b> It works: wrong answers fall to zero long before the hits do</li><li><b>B.</b> At 0.90 the remaining hits were all wrong; a higher threshold leaves few hits, mostly wrong</li><li><b>C.</b> It works for English only</li><li><b>D.</b> It works once personal data are masked</li></ul></li>
<li><p>At 8 visitors an engine shows 4 sequences running (its cap is 4), 4 waiting, and 22% of the cache in use. The TTFT p90 is 9 s. What is the diagnosis?</p><ul><li><b>A.</b> Preemption under cache pressure: lower the cap</li><li><b>B.</b> Prefill interference: switch on chunked prefill</li><li><b>C.</b> The card is too slow: add a second card</li><li><b>D.</b> Queueing at the sequence cap: raise the cap</li></ul></li>
<li><p>A deployment with a cap of 48 shows the cache 96% in use and the preemption counter rising by about 10 per 100 requests. Which change should come first?</p><ul><li><b>A.</b> Switch off prefix caching</li><li><b>B.</b> Raise the cap to 64 so waiting requests are admitted</li><li><b>C.</b> Lower the cap or give the cache more memory</li><li><b>D.</b> Raise the token budget per step</li></ul></li>
<li><p>Chat answers freeze for about two seconds whenever a long document arrives, yet the chat TPOT p90 is 110 ms. Why does TPOT miss the problem?</p><ul><li><b>A.</b> TPOT is measured on the server, the freeze on the client</li><li><b>B.</b> A two-second gap spread over 150 tokens moves the mean pace by only about 13 ms</li><li><b>C.</b> TPOT ignores the first token, where the freeze happens</li><li><b>D.</b> The freeze is in the network, which TPOT does not include</li></ul></li>
<li><p>With chunked prefill, budgets of 512, 1,024 and 2,048 tokens give chat stall p90 of 0.18, 0.35 and 0.68 s and document TTFT p90 of 2.47, 2.20 and 2.09 s. Under Musamir's objective, which budget do you choose?</p><ul><li><b>A.</b> 1,024: both clocks meet the objective with margin on the stall</li><li><b>B.</b> 2,048, because documents start fastest</li><li><b>C.</b> 8,192, to finish documents in one step</li><li><b>D.</b> 512, because chat stalls are smallest</li></ul></li>
<li><p>In a closed-loop test with 6 users, caps of 6, 8 and 12 give identical results. What explains it?</p><ul><li><b>A.</b> The cache limits the engine to six sequences</li><li><b>B.</b> The token budget caps the batch at six</li><li><b>C.</b> The simulator ignores the cap above 6</li><li><b>D.</b> Six users never put more than six requests in the engine at once</li></ul></li>
<li><p>A prompt is built as: request id, system instructions, tenant rules, conversation history, question. Prefix caching hits almost nothing. What change fixes it?</p><ul><li><b>A.</b> Switch to a block size of 32 tokens</li><li><b>B.</b> Raise the cache's memory</li><li><b>C.</b> Move the request id after the history, next to the question</li><li><b>D.</b> Shorten the system instructions</li></ul></li>
<li><p>Why does a per-tenant cache salt barely lower the hit rate in Lab 2.3?</p><ul><li><b>A.</b> The salt is ignored by the engine for short prompts</li><li><b>B.</b> Most reuse is within a tenant: its own rules, documents and conversation history</li><li><b>C.</b> The salt is applied only to the last block</li><li><b>D.</b> Salting doubles the cache size</li></ul></li>
<li><p>The base instructions are public text. Rawya still forbids reusing cache blocks across tenants. Which reason holds?</p><ul><li><b>A.</b> Reuse is visible in timing, and the rule must not depend on judging which text is sensitive</li><li><b>B.</b> Cross-tenant reuse slows the engine down</li><li><b>C.</b> Prefix caching is not allowed with Arabic text</li><li><b>D.</b> Reused blocks give wrong answers to the other tenant</li></ul></li>
<li><p>A semantic cache at threshold 0.90 hits 3.8% of questions, and every hit in the sample was a wrong answer. Hanadi's limit is one wrong answer in 1,000. What do you recommend?</p><ul><li><b>A.</b> Lower the threshold to get more right hits</li><li><b>B.</b> Use it for Arabic only</li><li><b>C.</b> Raise the threshold to 0.95</li><li><b>D.</b> No semantic cache on text alone; keep the prefix cache</li></ul></li>
<li><p>A question reads: "Can I move booking LW-482913 to Friday? Call me on 0551234567." What should a semantic cache do with it?</p><ul><li><b>A.</b> Skip masking, since the lookup is internal</li><li><b>B.</b> Store it with the numbers masked</li><li><b>C.</b> Mask it for the lookup and never store its answer</li><li><b>D.</b> Store it as written, since it is the visitor's own data</li></ul></li>
</ol>
</section>
<section>
<h2>Day 3: Cheaper tokens, same quality</h2>
<ol>
<li><p>A colleague proposes to put the visitor's booking reference at the start of Musamir's prompt "so the cache can find the visitor's earlier turns faster". What happens to the prefix cache?</p><ul><li><b>A.</b> It keeps working, because the salt isolates visitors</li><li><b>B.</b> Reuse rises, because each visitor's history is found at once</li><li><b>C.</b> Nothing, as long as the reference is masked</li><li><b>D.</b> The shared instructions are no longer reused across visitors</li></ul></li>
<li><p>Yamen wants 4-bit weights: 96% attainment at the peak, and "English quality is unchanged". The Arabic score is 0.693 against a floor of 0.73. What do you recommend?</p><ul><li><b>A.</b> Ship it: the Arabic interval reaches above the floor</li><li><b>B.</b> Ship it: the average of both languages is 0.76</li><li><b>C.</b> Keep 16-bit weights and buy a larger card</li><li><b>D.</b> Serve 8-bit weights, which pass both floors, and close the gap to the objective with the cache</li></ul></li>
<li><p>On 103 long Arabic items, the 16-bit cache scores 0.718 (interval 0.625 to 0.796) and the 8-bit cache 0.670 (0.574 to 0.753). Kenan says the intervals overlap, so there is no loss. What is the right test?</p><ul><li><b>A.</b> A paired difference on the same items, which here lies wholly below zero</li><li><b>B.</b> Run each cache three times and average</li><li><b>C.</b> Pool the long and short items to get more data</li><li><b>D.</b> Accept Kenan's reading: overlap means no difference</li></ul></li>
<li><p>In the quietest hour of the night Musamir serves three visitors at a time; at the evening peak about sixty. The draft is accepted at 0.46 per token in Arabic. Where should speculation be on?</p><ul><li><b>A.</b> Always: answers are identical, so it can only help</li><li><b>B.</b> Never for Arabic: acceptance under 0.5 makes it slower</li><li><b>C.</b> At night, where decode waits on memory and the cache has room</li><li><b>D.</b> Only at the peak, where speed matters most</li></ul></li>
<li><p>Finance asks for a threshold of 0.6 to cut cost further: 62% of requests to the mini model, English 0.820, Arabic 0.690. What do you answer?</p><ul><li><b>A.</b> Accept: English still passes its floor</li><li><b>B.</b> Refuse: Arabic falls under its floor; 0.4 is the largest saving that holds both with a margin</li><li><b>C.</b> Go further and send everything to the mini model</li><li><b>D.</b> Accept, and recover quality by quantising the mini model</li></ul></li>
<li><p>An 8B-parameter model moves from 16-bit to 8-bit weights on a 24 GB card. Roughly where does the freed memory go, and what does it buy?</p><ul><li><b>A.</b> Nowhere: the engine keeps the reservation</li><li><b>B.</b> About 8 GB more cache, so several times more conversations fit</li><li><b>C.</b> Faster arithmetic only; memory is unchanged</li><li><b>D.</b> A larger reserve for activations</li></ul></li>
<li><p>A 4-bit variant scores 0.833 in English (floor 0.81) and 0.693 in Arabic (floor 0.73), and has the best goodput. What is the decision?</p><ul><li><b>A.</b> Reject it: it fails the Arabic floor; serve a variant that passes both</li><li><b>B.</b> Ship it to English visitors only and keep 16 bits for Arabic, at no extra cost</li><li><b>C.</b> Ship it: goodput matters more at the peak</li><li><b>D.</b> Ship it: its average over both languages is 0.76</li></ul></li>
<li><p>Two cache formats were scored on the same 103 long Arabic items. Their separate 95% intervals overlap. What should you compute before concluding there is no loss?</p><ul><li><b>A.</b> Separate intervals at 99% instead</li><li><b>B.</b> The English score on the same items</li><li><b>C.</b> The mean of the two scores</li><li><b>D.</b> A paired difference over the same items, with its interval</li></ul></li>
<li><p>A draft model is accepted with probability 0.5 per token and proposes 3 tokens. About how many tokens does the base model emit per verification step?</p><ul><li><b>A.</b> 4</li><li><b>B.</b> 1.5</li><li><b>C.</b> 1.875</li><li><b>D.</b> 3</li></ul></li>
<li><p>Routing easy requests to a distilled model holds both floors at threshold 0.4 (Arabic 0.737, floor 0.73) and at 0.5 (Arabic 0.733). The set has 300 items per language. Which threshold do you serve?</p><ul><li><b>A.</b> 0.5: it holds both floors and costs less</li><li><b>B.</b> 0.4: it holds both floors with a margin the set can still detect</li><li><b>C.</b> 0.6: the cost falls further</li><li><b>D.</b> No routing: any loss is unacceptable</li></ul></li>
</ol>
</section>
<section>
<h2>Day 4: Across replicas and over the day</h2>
<ol>
<li><p>A new 3-bit format frees 1.2 GB more than 4-bit and scores 0.845 in English. Nobody has scored it in Arabic yet. What do you tell Yamen?</p><ul><li><b>A.</b> Ship it: English is above its floor, so Arabic will be too</li><li><b>B.</b> Ship it: the extra cache is worth any small loss</li><li><b>C.</b> Never use formats under 8 bits</li><li><b>D.</b> Score it in Arabic against the floor before any decision</li></ul></li>
<li><p>Another authority's assistant answers short questions with 3,000-token answers, under a 100 ms TPOT limit and a 1 s stall limit. Chunked prefill keeps its stall at 0.2 s. It has two cards. Should it disaggregate?</p><ul><li><b>A.</b> Yes: disaggregation always lowers TPOT</li><li><b>B.</b> Not on this evidence: the stall already meets its limit and prompts are short</li><li><b>C.</b> No: the cache transfer would break the TTFT objective</li><li><b>D.</b> Yes: long answers need a dedicated prefill card</li></ul></li>
<li><p>On three replicas, one shows 30 requests waiting and the cache 95% full; the other two show nothing waiting and the cache 20% full. The router hashes the tenant. What is the fix?</p><ul><li><b>A.</b> Add a fourth replica</li><li><b>B.</b> Raise the sequence cap on the busy replica</li><li><b>C.</b> Route by conversation with a load limit, so the busy tenant spreads over all replicas</li><li><b>D.</b> Remove the cache salt so the replicas can share blocks</li></ul></li>
<li><p>A replica takes 8 minutes to start. Demand rises from 2 to 10 requests a second in half an hour every evening. Which policy keeps the worst hour above 90% at the lowest cost?</p><ul><li><b>A.</b> Scale up when more than 20 requests are waiting</li><li><b>B.</b> Run enough replicas for the peak all day</li><li><b>C.</b> Scale on the rate with a minimum of zero</li><li><b>D.</b> Scale on the request rate at half of a replica's capacity, never below one replica</li></ul></li>
<li><p>Kenan's slide says self-hosting costs 2.58 SAR per million output tokens against a hosted 1.60, "so the hosted API is cheaper". Hanadi asks if that is the right comparison. What do you answer?</p><ul><li><b>A.</b> No: compare cost per successful request over a replayed day, input tokens included</li><li><b>B.</b> Yes: per-token prices are how providers compare</li><li><b>C.</b> No: idle hours should be left out of the node's cost</li><li><b>D.</b> No: compare the node at its peak capacity only</li></ul></li>
<li><p>With chunked prefill, two cards together keep the longest pause at 0.18 s and serve 96.5% of requests; split into a prefill and a decode card, 0.13 s and 93.9%. The objective allows a 1.0 s pause. What do you deploy?</p><ul><li><b>A.</b> Both phases on both cards: the shorter pause buys nothing under this objective</li><li><b>B.</b> The split, with a second prefill card bought for it</li><li><b>C.</b> One card only, since both layouts pass</li><li><b>D.</b> The split: its pauses are shorter</li></ul></li>
<li><p>A prompt of 5,000 tokens has a cache of 73,728 bytes per token. The link between prefill and decode moves 20 GB/s. About how long does the transfer take?</p><ul><li><b>A.</b> About 180 ms</li><li><b>B.</b> About 1.8 s</li><li><b>C.</b> About 2 ms</li><li><b>D.</b> About 18 ms</li></ul></li>
<li><p>A router hashes the tenant to pick one of three replicas. One replica shows 30 requests waiting and a full cache; the other two are almost idle. What is wrong?</p><ul><li><b>A.</b> The sequence cap is too high on the busy replica</li><li><b>B.</b> The replicas are too small</li><li><b>C.</b> Placement: the largest tenant always lands on one replica</li><li><b>D.</b> The cache salt prevents sharing between replicas</li></ul></li>
<li><p>A replica needs 8 minutes to start and the evening demand rises steeply. Which scaling signal keeps the worst hour above the objective at the lowest cost?</p><ul><li><b>A.</b> Requests waiting in the queue</li><li><b>B.</b> The request rate, with headroom, and at least one replica</li><li><b>C.</b> A fixed number of replicas for the peak, all day</li><li><b>D.</b> The request rate with a minimum of zero replicas</li></ul></li>
<li><p>Over a day the node costs 107 SAR and 40,000 requests met the objective; a hosted API would charge 0.00105 SAR per request. What is the node's cost per successful request, and which is cheaper?</p><ul><li><b>A.</b> 0.00268 SAR; the hosted API</li><li><b>B.</b> 0.00268 SAR; the node</li><li><b>C.</b> 0.000268 SAR; the node</li><li><b>D.</b> 0.0268 SAR; the hosted API</li></ul></li>
</ol>
</section>

idth.","misconceptions":["Treats decode as bound by arithmetic: at batch 1 the operations finish long before the weights arrive","","Mixes up the phases: more compute shortens prefill, it does not slow decode","Confuses capacity with speed: memory size decides how many fit, not how fast one decodes"],"lo":["LO1"],"day":1,"session":1,"slide":{"deck":"day1","id":"checkpoint-1","title":"Where does the time go?"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-2-q1","type":"single","prompt":"Another team serves a model with 32 layers, 32 query heads and 8 key-value heads of size 128, with a 16-bit cache, and has 4.2 GB left for the cache. About how many 4,000-token conversations fit at once?","options":[{"key":"A","text":"About 16"},{"key":"B","text":"About 2"},{"key":"C","text":"About 4"},{"key":"D","text":"About 8"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"2 × 32 × 8 × 128 × 2 = 131,072 bytes per token; 4,000 tokens is 0.52 GB; 4.2 GB holds about 8.","misconceptions":["Uses one byte per value: the cache is in 16 bits, two bytes each","Sizes with the 32 query heads as if every head were stored","Counts four bytes per value, as in 32-bit training: the cache is in 16 bits",""],"lo":["LO1"],"day":1,"session":2,"slide":{"deck":"day1","id":"checkpoint-2","title":"How many fit?"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-3-q1","type":"single","prompt":"A run at 16 users shows a mean TTFT of 1.7 s, a p90 TTFT of 9 s, a TPOT p90 of 95 ms, no stall over 1 s and 0.44 requests per second. Hanadi asks whether the objective is met. What do you report?","options":[{"key":"A","text":"Yes: the mean TTFT is under 2 s"},{"key":"B","text":"Yes: it serves 0.44 requests per second"},{"key":"C","text":"The share of requests that met all three, which the TTFT p90 says is under 90%"},{"key":"D","text":"Yes: the TPOT p90 is under 150 ms"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"If the 90th percentile of TTFT is 9 s, more than 10% of requests waited over 2 s, so attainment is under 90% whatever the mean.","misconceptions":["Reads a mean as the objective: the objective is per request","Treats throughput as success: busy is not served well","","Checks one clock only: a request must meet all three"],"lo":["LO2"],"day":1,"session":3,"slide":{"deck":"day1","id":"checkpoint-3","title":"Which number goes in the report?"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-4-q1","type":"single","prompt":"At 8 users, one run with a new engine setting gives a p90 TTFT of 1.5 s against the baseline's 1.96 s mean (sd 0.68 over three runs). What do you conclude?","options":[{"key":"A","text":"Nothing yet: the gap is inside the baseline's spread; run three repeats"},{"key":"B","text":"The setting cuts TTFT by a quarter"},{"key":"C","text":"It is better because throughput did not drop"},{"key":"D","text":"The setting is worse: the result is noisy"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A 0.46 s difference against a standard deviation of 0.68 s between runs is noise until repeats show otherwise.","misconceptions":["","Takes one run as a measurement: one run cannot show a spread","Uses the wrong measure: the decision rests on goodput, but the spread problem remains","Overcorrects: a noisy result is not evidence of harm either"],"lo":["LO2"],"day":1,"session":4,"slide":{"deck":"day1","id":"checkpoint-4","title":"Is the new setting better?"},"level":null,"pool":"checkpoint"},{"id":"review-checkpoint-q1","type":"single","prompt":"Kenan reads the Day 1 curve and says: \"throughput keeps rising to 16 users, so the engine has headroom; let us admit more visitors.\" What is wrong with the argument?","options":[{"key":"A","text":"The curve has too few runs to say anything"},{"key":"B","text":"A closed loop cannot measure throughput"},{"key":"C","text":"Throughput counts requests finished, met or not; past 4 users goodput falls"},{"key":"D","text":"Throughput only counts at the evening peak"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"At 12 users throughput is 0.44 requests per second and goodput 0.02: the engine is busy and almost no visitor is served within the objective.","misconceptions":["Blames the measurement: the three runs per point agree, the spread is small next to the drop","True of a closed loop in general, but it does not answer the claim: the drop is in the requests that met the objective","","Confuses the objective with the peak: the objective is per request, whatever the arrival rate"],"lo":["LO2"],"day":2,"session":null,"slide":{"deck":"day2","id":"review-checkpoint","title":"Yesterday's claim, read again"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-1-q1","type":"single","prompt":"A deployment misses the objective at 10 visitors. Its gauges: 10 running, 6 waiting, cache 97% in use, preemptions climbing. Yamen wants to double the sequence cap. What do you tell him?","options":[{"key":"A","text":"Do not raise the cap: the cache is the limit; lower the cap or free memory for the cache"},{"key":"B","text":"Raise it: six requests are waiting"},{"key":"C","text":"Keep the cap and halve the token budget"},{"key":"D","text":"Rerun with a different load generator first"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A full cache with rising preemptions means admitted answers outgrow the blocks; more admissions mean more evictions and recomputation.","misconceptions":["","Reads only the queue: a queue with a full cache and preemptions is not the cap refusing work","Treats the token budget as the cure for cache pressure: it limits work per step, not the blocks held by answers","Blames the load generator: the gauges come from the engine, not the client"],"lo":["LO3"],"day":2,"session":1,"slide":{"deck":"day2","id":"checkpoint-1","title":"Which fault is it?"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-2-q1","type":"single","prompt":"Asrar reports that English chat answers freeze for about a second, several times an evening, while TPOT p90 stays at 110 ms. Chunked prefill is on with a budget of 8,192 tokens. What is the most likely cause?","options":[{"key":"A","text":"Decoding is too slow for English"},{"key":"B","text":"The cache is full and answers are preempted"},{"key":"C","text":"The sequence cap is too low"},{"key":"D","text":"The budget is so large that a whole long prompt still fits in one step"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Chunking only cuts prompts longer than the budget; at 8,192 tokens a 5,000-token document is still prefilled in one step and every answer waits for it.","misconceptions":["TPOT is within the objective; the freezes are single long gaps, not a slow pace","Preemption shows as restarts and a full cache; nothing here points to the cache","The cap limits admissions, it does not lengthen one step",""],"lo":["LO3"],"day":2,"session":2,"slide":{"deck":"day2","id":"checkpoint-2","title":"Where did the freeze come from?"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-3-q1","type":"single","prompt":"Product wants Musamir to greet each visitor by first name, so the name must be in the prompt. Prefix caching and a salt per tenant are on. Where should the name go?","options":[{"key":"A","text":"At the start: the salt keeps it private"},{"key":"B","text":"After everything shared, next to the question"},{"key":"C","text":"Inside the tenant's rules, so each tenant handles it"},{"key":"D","text":"Nowhere: names cannot be used with a prefix cache"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Anything that differs per request must come after the parts others can reuse; next to the question it costs one block at most.","misconceptions":["The salt separates tenants, not visitors: a name at the start still defeats every block after it","","The tenant part is shared by every visitor of the tenant; a name there breaks reuse for all of them","Moving it out of the prompt does not meet the requirement: the model must see it to use it"],"lo":["LO4"],"day":2,"session":3,"slide":{"deck":"day2","id":"checkpoint-3","title":"Where does the name go?"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-4-q1","type":"single","prompt":"The vendor answers Hanadi: \"If wrong answers worry you, raise the threshold to 0.95.\" What does Lab 2.4's data say about that?","options":[{"key":"A","text":"It works: wrong answers fall to zero long before the hits do"},{"key":"B","text":"At 0.90 the remaining hits were all wrong; a higher threshold leaves few hits, mostly wrong"},{"key":"C","text":"It works for English only"},{"key":"D","text":"It works once personal data are masked"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Pairs that differ in one slot share almost every character, so they are the last to fall below any threshold.","misconceptions":["A higher threshold does remove hits, but the wrong ones are the most similar pairs and go last","","The language gap is real but not the reason: both languages miss the limit at every threshold","Masking keeps personal data out; it does not change whether the stored answer fits the new question"],"lo":["LO4"],"day":2,"session":4,"slide":{"deck":"day2","id":"checkpoint-4","title":"Will a higher threshold fix it?"},"level":null,"pool":"checkpoint"},{"id":"review-checkpoint-q1","type":"single","prompt":"A colleague proposes to put the visitor's booking reference at the start of Musamir's prompt \"so the cache can find the visitor's earlier turns faster\". What happens to the prefix cache?","options":[{"key":"A","text":"It keeps working, because the salt isolates visitors"},{"key":"B","text":"Reuse rises, because each visitor's history is found at once"},{"key":"C","text":"Nothing, as long as the reference is masked"},{"key":"D","text":"The shared instructions are no longer reused across visitors"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Each block's hash covers everything before it: a different first block makes every later block, including the 640 shared tokens, a miss.","misconceptions":["The salt separates tenants; it does nothing about a part that differs per visitor","The history is reused only when everything before it matches; a per-visitor start breaks reuse of the shared parts for everyone","Masking is a rule for the semantic cache; the prefix cache works on tokens and never returns stored answers",""],"lo":["LO4"],"day":3,"session":null,"slide":{"deck":"day3","id":"review-checkpoint","title":"Yesterday's caches, read again"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-1-q1","type":"single","prompt":"Yamen wants 4-bit weights: 96% attainment at the peak, and \"English quality is unchanged\". The Arabic score is 0.693 against a floor of 0.73. What do you recommend?","options":[{"key":"A","text":"Ship it: the Arabic interval reaches above the floor"},{"key":"B","text":"Ship it: the average of both languages is 0.76"},{"key":"C","text":"Keep 16-bit weights and buy a larger card"},{"key":"D","text":"Serve 8-bit weights, which pass both floors, and close the gap to the objective with the cache"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"4-bit fails the Arabic floor by almost four points; 8-bit passes both and already serves 82% at the peak.","misconceptions":["The interval reaches 0.743 but the point estimate is under the floor; the rule uses the score, and the interval says only that more items are needed","An average over both languages hides the language that fails; the floors are per language","A larger card is a cost decision for Day 4, and nothing says 16 bits are needed: 8 bits pass both floors",""],"lo":["LO5"],"day":3,"session":1,"slide":{"deck":"day3","id":"checkpoint-1","title":"Ship the fastest variant?"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-2-q1","type":"single","prompt":"On 103 long Arabic items, the 16-bit cache scores 0.718 (interval 0.625 to 0.796) and the 8-bit cache 0.670 (0.574 to 0.753). Kenan says the intervals overlap, so there is no loss. What is the right test?","options":[{"key":"A","text":"A paired difference on the same items, which here lies wholly below zero"},{"key":"B","text":"Run each cache three times and average"},{"key":"C","text":"Pool the long and short items to get more data"},{"key":"D","text":"Accept Kenan's reading: overlap means no difference"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Both caches answered the same items; the difference per item has far less variation than either score, so its interval is narrower.","misconceptions":["","More runs of the engine do not change recorded answers; the uncertainty is in the items","Adding short items, where nothing changed, dilutes the effect being measured","Overlapping separate intervals do not show that two paired results are equal"],"lo":["LO5"],"day":3,"session":2,"slide":{"deck":"day3","id":"checkpoint-2","title":"Is the loss real?"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-3-q1","type":"single","prompt":"In the quietest hour of the night Musamir serves three visitors at a time; at the evening peak about sixty. The draft is accepted at 0.46 per token in Arabic. Where should speculation be on?","options":[{"key":"A","text":"Always: answers are identical, so it can only help"},{"key":"B","text":"Never for Arabic: acceptance under 0.5 makes it slower"},{"key":"C","text":"At night, where decode waits on memory and the cache has room"},{"key":"D","text":"Only at the peak, where speed matters most"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"With few sequences, checking four tokens costs little more than one and the cache has room; with many, the draft's memory takes blocks the queue needs, and requests wait longer to start than speculation saves.","misconceptions":["The peak is where its memory cost bites: half the blocks go to the draft and requests wait","Arabic still gains 1.75 tokens a step; acceptance under 0.5 does not make it useless","","Exactly backwards: the peak is when memory is scarce and batches already use the weight reads"],"lo":["LO5"],"day":3,"session":3,"slide":{"deck":"day3","id":"checkpoint-3","title":"When does speculation pay?"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-4-q1","type":"single","prompt":"Finance asks for a threshold of 0.6 to cut cost further: 62% of requests to the mini model, English 0.820, Arabic 0.690. What do you answer?","options":[{"key":"A","text":"Accept: English still passes its floor"},{"key":"B","text":"Refuse: Arabic falls under its floor; 0.4 is the largest saving that holds both with a margin"},{"key":"C","text":"Go further and send everything to the mini model"},{"key":"D","text":"Accept, and recover quality by quantising the mini model"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Between 0.5 and 0.6 the router starts sending Arabic requests the mini model gets wrong; the Arabic score falls 4.3 points while English falls 1.","misconceptions":["English passing does not cover Arabic; the floors are per language","","The mini model alone is far under both floors; routing exists because it cannot serve everything","Quantising the mini model changes its cost, not the base's quality on the hard requests now routed away"],"lo":["LO5"],"day":3,"session":4,"slide":{"deck":"day3","id":"checkpoint-4","title":"What breaks first?"},"level":null,"pool":"checkpoint"},{"id":"review-checkpoint-q1","type":"single","prompt":"A new 3-bit format frees 1.2 GB more than 4-bit and scores 0.845 in English. Nobody has scored it in Arabic yet. What do you tell Yamen?","options":[{"key":"A","text":"Ship it: English is above its floor, so Arabic will be too"},{"key":"B","text":"Ship it: the extra cache is worth any small loss"},{"key":"C","text":"Never use formats under 8 bits"},{"key":"D","text":"Score it in Arabic against the floor before any decision"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The floors are per language, and Day 3 showed a format can hold English and fail Arabic.","misconceptions":["English held under 4-bit while Arabic fell seven points; English says nothing about Arabic","The memory gain is small and the quality is unknown: more cache cannot justify an unmeasured floor","The floor rule needs a score per language, not a rejection of the whole format family",""],"lo":["LO5"],"day":4,"session":null,"slide":{"deck":"day4","id":"review-checkpoint","title":"Yesterday's trade, read again"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-1-q1","type":"single","prompt":"Another authority's assistant answers short questions with 3,000-token answers, under a 100 ms TPOT limit and a 1 s stall limit. Chunked prefill keeps its stall at 0.2 s. It has two cards. Should it disaggregate?","options":[{"key":"A","text":"Yes: disaggregation always lowers TPOT"},{"key":"B","text":"Not on this evidence: the stall already meets its limit and prompts are short"},{"key":"C","text":"No: the cache transfer would break the TTFT objective"},{"key":"D","text":"Yes: long answers need a dedicated prefill card"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Split pays when chunked steps break a decode limit; here they do not, and one card of two would serve few, short prefills.","misconceptions":["Disaggregation removes chunk steps from decode; with short prompts there is little to remove","","The transfer grows with the prompt; short prompts make it smaller, not decisive","Long answers load the decode phase; that argues for more decode capacity, not for a prefill pool"],"lo":["LO6"],"day":4,"session":1,"slide":{"deck":"day4","id":"checkpoint-1","title":"Split the cards?"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-2-q1","type":"single","prompt":"On three replicas, one shows 30 requests waiting and the cache 95% full; the other two show nothing waiting and the cache 20% full. The router hashes the tenant. What is the fix?","options":[{"key":"A","text":"Add a fourth replica"},{"key":"B","text":"Raise the sequence cap on the busy replica"},{"key":"C","text":"Route by conversation with a load limit, so the busy tenant spreads over all replicas"},{"key":"D","text":"Remove the cache salt so the replicas can share blocks"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A hot spot is placement, not capacity: two replicas idle while one drowns.","misconceptions":["More replicas behind the same hash still send the big tenant to one of them","The cap is not the cause: the load is unevenly placed","","Removing the salt would mix tenants' blocks, which Rawya forbids, and does not move load"],"lo":["LO6"],"day":4,"session":2,"slide":{"deck":"day4","id":"checkpoint-2","title":"Read the replica metrics"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-3-q1","type":"single","prompt":"A replica takes 8 minutes to start. Demand rises from 2 to 10 requests a second in half an hour every evening. Which policy keeps the worst hour above 90% at the lowest cost?","options":[{"key":"A","text":"Scale up when more than 20 requests are waiting"},{"key":"B","text":"Run enough replicas for the peak all day"},{"key":"C","text":"Scale on the rate with a minimum of zero"},{"key":"D","text":"Scale on the request rate at half of a replica's capacity, never below one replica"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The rate rises before the queue does, and the headroom of 50% covers the minutes a new replica needs to start.","misconceptions":["The queue appears only once visitors already wait; with an 8-minute start they wait for 8 minutes","Meets the objective at more than twice the cost: the cards idle most of the day","Saves almost nothing and leaves the first visitors of the day waiting a cold start",""],"lo":["LO6"],"day":4,"session":3,"slide":{"deck":"day4","id":"checkpoint-3","title":"Which signal?"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-4-q1","type":"single","prompt":"Kenan's slide says self-hosting costs 2.58 SAR per million output tokens against a hosted 1.60, \"so the hosted API is cheaper\". Hanadi asks if that is the right comparison. What do you answer?","options":[{"key":"A","text":"No: compare cost per successful request over a replayed day, input tokens included"},{"key":"B","text":"Yes: per-token prices are how providers compare"},{"key":"C","text":"No: idle hours should be left out of the node's cost"},{"key":"D","text":"No: compare the node at its peak capacity only"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The hosted bill counts 2,004 input tokens a request; the node's bill counts idle hours. Only the cost per served request over a real day includes both.","misconceptions":["","Right conclusion by accident: the comparison leaves out input tokens and the idle hours, which point in opposite directions","The minimum replica's idle night is a real cost on the bill, not an accounting choice","Peak capacity is not what the authority pays for; it pays for every hour of every card"],"lo":["LO6"],"day":4,"session":4,"slide":{"deck":"day4","id":"checkpoint-4","title":"Which number goes to the Director?"},"level":null,"pool":"checkpoint"},{"id":"q-lo1-decode-bound","type":"single","prompt":"A 7B model in 16 bits decodes one sequence on a card with 400 GB/s of bandwidth reached at 80%. About how long is one decode step, ignoring the cache?","options":[{"key":"A","text":"About 4 ms"},{"key":"B","text":"About 44 ms"},{"key":"C","text":"About 88 ms"},{"key":"D","text":"About 22 ms"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"14 GB of weights read at 320 GB/s takes about 44 ms; at batch 1 the step waits on memory.","misconceptions":["Divides by the operation rate as if decode were bound by arithmetic","","Counts four bytes per weight, as in 32-bit training","Counts one byte per weight, as if the model were in 8 bits"],"lo":["LO1"],"day":1,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo1-prefill-bound","type":"single","prompt":"A visitor pastes a 6,000-token event terms document. Which resource mostly sets the time to its first token on Musamir's L4?","options":[{"key":"A","text":"The accelerator's arithmetic rate"},{"key":"B","text":"The network between the visitor and the node"},{"key":"C","text":"Memory bandwidth, because the weights are read for every token"},{"key":"D","text":"The size of the cache"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A prefill processes all 6,000 tokens in one pass that shares one read of the weights, so it is bound by arithmetic.","misconceptions":["","Blames transport for compute time: the tokens are small","Assumes the prompt is read token by token as in decode","Confuses whether it fits with how fast it runs"],"lo":["LO1"],"day":1,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"q-lo1-kv-gqa","type":"single","prompt":"A model has 40 layers, 40 query heads and 8 key-value heads of size 128, with a 16-bit cache. How many bytes of cache does one token take?","options":[{"key":"A","text":"819,200 bytes"},{"key":"B","text":"81,920 bytes"},{"key":"C","text":"40,960 bytes"},{"key":"D","text":"163,840 bytes"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"2 × 40 layers × 8 KV heads × 128 × 2 bytes = 163,840 bytes; only the key-value heads are stored.","misconceptions":["Sizes with the 40 query heads as if every head were stored","Stores only keys, or only values","Counts one byte per value and keys only",""],"lo":["LO1"],"day":1,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo1-reserve","type":"single","prompt":"Your prediction says 18 conversations of 2,000 tokens fit; the engine holds 12 and preempts. The model and length are right. What did the prediction most likely leave out?","options":[{"key":"A","text":"The speed of the accelerator"},{"key":"B","text":"The query heads"},{"key":"C","text":"The engine's reserve for activations and the memory-utilisation limit"},{"key":"D","text":"The tokenizer's vocabulary"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The cache gets only what is left after the utilisation limit, the weights and the reserve; leaving those out overstates the cache.","misconceptions":["Speed does not change how many conversations fit","Would make the prediction four times too low, not too high","","The vocabulary affects weights, already counted"],"lo":["LO1"],"day":1,"session":2,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-lo1-binding","type":"single","prompt":"Musamir in 16 bits holds about 12 conversations of 2,000 tokens, and decoding reaches the ridge point only at about 246 sequences. What binds the baseline's concurrency?","options":[{"key":"A","text":"The sequence cap of the engine"},{"key":"B","text":"Cache memory: the batch never grows enough to use the arithmetic"},{"key":"C","text":"The network bandwidth"},{"key":"D","text":"Arithmetic: the card is too slow"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The cache fills at about 12 sequences, far below the 246 at which decode would use the arithmetic: memory capacity binds.","misconceptions":["Blames a setting that could be raised without more room","","Moves the problem outside the node","Reads a memory-bound step as a slow processor"],"lo":["LO1"],"day":1,"session":2,"slide":null,"level":"evaluate","pool":"practice"},{"id":"q-lo2-goodput","type":"single","prompt":"In 100 seconds an engine finishes 60 requests; 45 met the whole objective (TTFT, TPOT and stall), 10 missed only the TPOT limit, 5 missed only the TTFT limit. What is the goodput?","options":[{"key":"A","text":"0.45 requests per second"},{"key":"B","text":"0.60 requests per second"},{"key":"C","text":"0.55 requests per second"},{"key":"D","text":"0.50 requests per second"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Only requests meeting the whole objective count: 45 in 100 s is 0.45 per second.","misconceptions":["","Counts throughput, every finished request","Counts the requests that met TTFT","Counts the requests that met TPOT"],"lo":["LO2"],"day":1,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo2-mean","type":"single","prompt":"Two configurations have the same mean TTFT of 1.4 s. A has a p90 of 1.9 s, B a p90 of 4.2 s. Against Musamir's objective, which serves visitors better?","options":[{"key":"A","text":"Neither can be judged without throughput"},{"key":"B","text":"They are equal: the means are the same"},{"key":"C","text":"B, because its spread shows it handles bursts"},{"key":"D","text":"A: more of its requests meet the 2.0 s objective"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The objective is per request; A's 90th percentile is under 2.0 s, B's is not.","misconceptions":["Throughput does not tell who was served well","Treats the mean as the objective","Reads a long tail as a strength",""],"lo":["LO2"],"day":1,"session":3,"slide":null,"level":"evaluate","pool":"practice"},{"id":"q-lo2-knee","type":"single","prompt":"A curve shows throughput rising from 0.25 to 0.44 requests per second between 4 and 16 users, while goodput falls from 0.23 to 0.00. Where should the engine be run?","options":[{"key":"A","text":"Anywhere: the objective is met on average"},{"key":"B","text":"At 16 users, where throughput is highest"},{"key":"C","text":"Near 4 users, with admission control holding it there"},{"key":"D","text":"At 1 user, where every request meets the objective"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The knee of goodput is the operating point; beyond it extra load is served late.","misconceptions":["Averages away a per-request objective","Optimises the busy measure, not the served one","","Wastes the batching that is free until the knee"],"lo":["LO2"],"day":1,"session":4,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-lo2-repeats","type":"single","prompt":"One run of a new setting gives a p90 TTFT 0.3 s lower than the baseline, whose three runs spread by 0.6 s. What do you report?","options":[{"key":"A","text":"An improvement of 0.3 s"},{"key":"B","text":"No difference established yet; repeat the new setting three times"},{"key":"C","text":"A regression, because the result is noisy"},{"key":"D","text":"An improvement, because throughput held"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A difference smaller than the run-to-run spread is not evidence until repeated.","misconceptions":["Takes one run as a measurement","","Treats noise as evidence of harm","Swaps the question for another measure"],"lo":["LO2"],"day":1,"session":4,"slide":null,"level":"evaluate","pool":"practice"},{"id":"q-lo2-open-loop","type":"single","prompt":"Why can a closed-loop test at 16 users look survivable when the real evening peak is not?","options":[{"key":"A","text":"Closed-loop users wait for each answer, so the load eases when the engine slows"},{"key":"B","text":"Closed-loop tests use shorter prompts"},{"key":"C","text":"Open-loop tests add network delay"},{"key":"D","text":"Closed-loop tests skip the warm-up"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Real arrivals keep coming whatever the engine does; a closed loop throttles itself.","misconceptions":["","The prompts are the same in both","Neither adds delay by itself","Warm-up is dropped in both"],"lo":["LO2"],"day":1,"session":4,"slide":null,"level":"understand","pool":"practice"},{"id":"q-lo3-queueing","type":"single","prompt":"At 8 visitors an engine shows 4 sequences running (its cap is 4), 4 waiting, and 22% of the cache in use. The TTFT p90 is 9 s. What is the diagnosis?","options":[{"key":"A","text":"Preemption under cache pressure: lower the cap"},{"key":"B","text":"Prefill interference: switch on chunked prefill"},{"key":"C","text":"The card is too slow: add a second card"},{"key":"D","text":"Queueing at the sequence cap: raise the cap"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The engine runs at its cap with a queue while most of the cache is free: the cap refuses work the card has room for.","misconceptions":["Preemption needs a nearly full cache; here it is four-fifths empty","Interference shows as stalls in running answers, not as a queue","Buys hardware for a limit set by one setting",""],"lo":["LO3"],"day":2,"session":1,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-lo3-preemption","type":"single","prompt":"A deployment with a cap of 48 shows the cache 96% in use and the preemption counter rising by about 10 per 100 requests. Which change should come first?","options":[{"key":"A","text":"Switch off prefix caching"},{"key":"B","text":"Raise the cap to 64 so waiting requests are admitted"},{"key":"C","text":"Lower the cap or give the cache more memory"},{"key":"D","text":"Raise the token budget per step"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Answers outgrow the blocks the engine admitted them with; fewer sequences or more blocks stop the evictions and the recomputation.","misconceptions":["Shared blocks save memory; removing them adds pressure","More admissions mean more evictions when the cache is the limit","","The budget limits work per step, not the blocks answers hold"],"lo":["LO3"],"day":2,"session":1,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-lo3-stall","type":"single","prompt":"Chat answers freeze for about two seconds whenever a long document arrives, yet the chat TPOT p90 is 110 ms. Why does TPOT miss the problem?","options":[{"key":"A","text":"TPOT is measured on the server, the freeze on the client"},{"key":"B","text":"A two-second gap spread over 150 tokens moves the mean pace by only about 13 ms"},{"key":"C","text":"TPOT ignores the first token, where the freeze happens"},{"key":"D","text":"The freeze is in the network, which TPOT does not include"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"TPOT is a mean over the answer; one long gap barely moves it, which is why the objective also limits the longest stall.","misconceptions":["Both can be measured from the client's stream","","The freezes happen mid-answer, after the first token","The gap comes from one long engine step, not transport"],"lo":["LO3"],"day":2,"session":2,"slide":null,"level":"understand","pool":"practice"},{"id":"q-lo3-budget","type":"single","prompt":"With chunked prefill, budgets of 512, 1,024 and 2,048 tokens give chat stall p90 of 0.18, 0.35 and 0.68 s and document TTFT p90 of 2.47, 2.20 and 2.09 s. Under Musamir's objective, which budget do you choose?","options":[{"key":"A","text":"1,024: both clocks meet the objective with margin on the stall"},{"key":"B","text":"2,048, because documents start fastest"},{"key":"C","text":"8,192, to finish documents in one step"},{"key":"D","text":"512, because chat stalls are smallest"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"512 pushes document TTFT over 2.0 s; 2,048 meets both but with less margin under the 1 s stall; 1,024 balances the two.","misconceptions":["","Defensible on these numbers but trades away the stall margin for 0.1 s","Brings back the stalls chunking was switched on to remove","Optimises one clock and breaks the other"],"lo":["LO3"],"day":2,"session":2,"slide":null,"level":"evaluate","pool":"practice"},{"id":"q-lo3-closed-cap","type":"single","prompt":"In a closed-loop test with 6 users, caps of 6, 8 and 12 give identical results. What explains it?","options":[{"key":"A","text":"The cache limits the engine to six sequences"},{"key":"B","text":"The token budget caps the batch at six"},{"key":"C","text":"The simulator ignores the cap above 6"},{"key":"D","text":"Six users never put more than six requests in the engine at once"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Each closed-loop user waits for an answer before sending again, so the engine never holds more requests than users.","misconceptions":["The cache holds far more than six sequences at this load","The budget limits tokens per step, not sequences","The cap works; there is simply nothing more to admit",""],"lo":["LO3"],"day":2,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"q-lo4-layout","type":"single","prompt":"A prompt is built as: request id, system instructions, tenant rules, conversation history, question. Prefix caching hits almost nothing. What change fixes it?","options":[{"key":"A","text":"Switch to a block size of 32 tokens"},{"key":"B","text":"Raise the cache's memory"},{"key":"C","text":"Move the request id after the history, next to the question"},{"key":"D","text":"Shorten the system instructions"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A block is reused only if every token before it is identical; a changing first token makes every block a miss.","misconceptions":["Larger blocks make reuse harder, not easier","The blocks miss because their hashes differ, not because they were evicted","","A shorter shared part is still never reused behind a changing id"],"lo":["LO4"],"day":2,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo4-salt","type":"single","prompt":"Why does a per-tenant cache salt barely lower the hit rate in Lab 2.3?","options":[{"key":"A","text":"The salt is ignored by the engine for short prompts"},{"key":"B","text":"Most reuse is within a tenant: its own rules, documents and conversation history"},{"key":"C","text":"The salt is applied only to the last block"},{"key":"D","text":"Salting doubles the cache size"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Only the shared base text was reused across tenants; tenants mostly reuse their own blocks, which the salt keeps.","misconceptions":["The salt changes every block's hash, whatever the length","","It is mixed into the first block, so it changes every hash after it","The salt changes hashes, not memory"],"lo":["LO4"],"day":2,"session":3,"slide":null,"level":"understand","pool":"practice"},{"id":"q-lo4-isolation","type":"single","prompt":"The base instructions are public text. Rawya still forbids reusing cache blocks across tenants. Which reason holds?","options":[{"key":"A","text":"Reuse is visible in timing, and the rule must not depend on judging which text is sensitive"},{"key":"B","text":"Cross-tenant reuse slows the engine down"},{"key":"C","text":"Prefix caching is not allowed with Arabic text"},{"key":"D","text":"Reused blocks give wrong answers to the other tenant"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A faster first token reveals that another tenant's prompt started the same way; a salt per tenant closes that channel at little cost.","misconceptions":["","Reuse makes requests faster, not slower","Reuse works on tokens in any language","Prefix reuse never changes an answer; the model still writes it"],"lo":["LO4"],"day":2,"session":3,"slide":null,"level":"evaluate","pool":"practice"},{"id":"q-lo4-semantic","type":"single","prompt":"A semantic cache at threshold 0.90 hits 3.8% of questions, and every hit in the sample was a wrong answer. Hanadi's limit is one wrong answer in 1,000. What do you recommend?","options":[{"key":"A","text":"Lower the threshold to get more right hits"},{"key":"B","text":"Use it for Arabic only"},{"key":"C","text":"Raise the threshold to 0.95"},{"key":"D","text":"No semantic cache on text alone; keep the prefix cache"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The wrong pairs differ in one slot and are the most similar; no threshold removes them before the useful hits.","misconceptions":["Adds hits, and wrong answers with them","Arabic was the worse language at 0.90","Leaves the near-identical wrong pairs, the last to fall",""],"lo":["LO4"],"day":2,"session":4,"slide":null,"level":"evaluate","pool":"practice"},{"id":"q-lo4-pii","type":"single","prompt":"A question reads: \"Can I move booking LW-482913 to Friday? Call me on 0551234567.\" What should a semantic cache do with it?","options":[{"key":"A","text":"Skip masking, since the lookup is internal"},{"key":"B","text":"Store it with the numbers masked"},{"key":"C","text":"Mask it for the lookup and never store its answer"},{"key":"D","text":"Store it as written, since it is the visitor's own data"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Masking keeps numbers out of the index and logs; an answer written for one booking must never be served to another visitor.","misconceptions":["The index and logs are where personal data leak","The answer itself was written for that booking and would be served to others","","A cached answer is served to other visitors"],"lo":["LO4"],"day":2,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo5-memory","type":"single","prompt":"An 8B-parameter model moves from 16-bit to 8-bit weights on a 24 GB card. Roughly where does the freed memory go, and what does it buy?","options":[{"key":"A","text":"Nowhere: the engine keeps the reservation"},{"key":"B","text":"About 8 GB more cache, so several times more conversations fit"},{"key":"C","text":"Faster arithmetic only; memory is unchanged"},{"key":"D","text":"A larger reserve for activations"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The weights shrink by about 8 GB; the engine gives what is left after weights and reserve to the cache, which more than triples here.","misconceptions":["The engine sizes the cache from what remains at start","","FP8 also speeds arithmetic on cards that support it, but the memory saving is real","The reserve is fixed; the cache takes the rest"],"lo":["LO5"],"day":3,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo5-per-language","type":"single","prompt":"A 4-bit variant scores 0.833 in English (floor 0.81) and 0.693 in Arabic (floor 0.73), and has the best goodput. What is the decision?","options":[{"key":"A","text":"Reject it: it fails the Arabic floor; serve a variant that passes both"},{"key":"B","text":"Ship it to English visitors only and keep 16 bits for Arabic, at no extra cost"},{"key":"C","text":"Ship it: goodput matters more at the peak"},{"key":"D","text":"Ship it: its average over both languages is 0.76"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The floors are per language; a variant that misses one does not pass, however fast it is.","misconceptions":["","Two models mean two pools of cards: a cost, not free","Capacity does not buy back quality under the floor","An average hides the language that fails"],"lo":["LO5"],"day":3,"session":1,"slide":null,"level":"evaluate","pool":"practice"},{"id":"q-lo5-paired","type":"single","prompt":"Two cache formats were scored on the same 103 long Arabic items. Their separate 95% intervals overlap. What should you compute before concluding there is no loss?","options":[{"key":"A","text":"Separate intervals at 99% instead"},{"key":"B","text":"The English score on the same items"},{"key":"C","text":"The mean of the two scores"},{"key":"D","text":"A paired difference over the same items, with its interval"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Pairing removes the variation the two variants share; its interval can lie below zero when separate intervals overlap.","misconceptions":["Wider separate intervals overlap more, not less","Another language does not test this one","A mean of two scores says nothing about their difference",""],"lo":["LO5"],"day":3,"session":2,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-lo5-spec","type":"single","prompt":"A draft model is accepted with probability 0.5 per token and proposes 3 tokens. About how many tokens does the base model emit per verification step?","options":[{"key":"A","text":"4"},{"key":"B","text":"1.5"},{"key":"C","text":"1.875"},{"key":"D","text":"3"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"(1 - 0.5^4) / (1 - 0.5) = 0.9375 / 0.5 = 1.875 tokens per step, before counting the draft's own time.","misconceptions":["Adds the base model's token to a draft that is always accepted","Counts only the accepted share of drafted tokens, without the base model's own token","","Assumes every drafted token is accepted"],"lo":["LO5"],"day":3,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo5-route","type":"single","prompt":"Routing easy requests to a distilled model holds both floors at threshold 0.4 (Arabic 0.737, floor 0.73) and at 0.5 (Arabic 0.733). The set has 300 items per language. Which threshold do you serve?","options":[{"key":"A","text":"0.5: it holds both floors and costs less"},{"key":"B","text":"0.4: it holds both floors with a margin the set can still detect"},{"key":"C","text":"0.6: the cost falls further"},{"key":"D","text":"No routing: any loss is unacceptable"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"0.3 points over the floor is far inside the noise of 300 items; 0.4 keeps more margin at a small extra cost.","misconceptions":["Defensible on the rule alone but leaves no margin for drift on new traffic","","At 0.6 Arabic falls under its floor","The floors already define the acceptable loss"],"lo":["LO5"],"day":3,"session":4,"slide":null,"level":"evaluate","pool":"practice"},{"id":"q-lo6-disagg","type":"single","prompt":"With chunked prefill, two cards together keep the longest pause at 0.18 s and serve 96.5% of requests; split into a prefill and a decode card, 0.13 s and 93.9%. The objective allows a 1.0 s pause. What do you deploy?","options":[{"key":"A","text":"Both phases on both cards: the shorter pause buys nothing under this objective"},{"key":"B","text":"The split, with a second prefill card bought for it"},{"key":"C","text":"One card only, since both layouts pass"},{"key":"D","text":"The split: its pauses are shorter"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Disaggregation pays when a decode limit is tighter than a chunked step; here the objective allows 1.0 s and together serves more.","misconceptions":["","Adds cost to fix a problem the objective does not have","Two cards were needed for the load; passing on two says nothing about one","Optimises a clock that already meets its limit"],"lo":["LO6"],"day":4,"session":1,"slide":null,"level":"evaluate","pool":"practice"},{"id":"q-lo6-transfer","type":"single","prompt":"A prompt of 5,000 tokens has a cache of 73,728 bytes per token. The link between prefill and decode moves 20 GB/s. About how long does the transfer take?","options":[{"key":"A","text":"About 180 ms"},{"key":"B","text":"About 1.8 s"},{"key":"C","text":"About 2 ms"},{"key":"D","text":"About 18 ms"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"5,000 × 73,728 = 369 MB; at 20 GB/s that is about 18 ms.","misconceptions":["Uses 2 GB/s, a factor of ten too slow","Mixes megabytes and gigabytes","Drops a factor of ten in the bytes",""],"lo":["LO6"],"day":4,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo6-router","type":"single","prompt":"A router hashes the tenant to pick one of three replicas. One replica shows 30 requests waiting and a full cache; the other two are almost idle. What is wrong?","options":[{"key":"A","text":"The sequence cap is too high on the busy replica"},{"key":"B","text":"The replicas are too small"},{"key":"C","text":"Placement: the largest tenant always lands on one replica"},{"key":"D","text":"The cache salt prevents sharing between replicas"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Two idle replicas and one drowning one is a hot spot: route by conversation with a load limit instead.","misconceptions":["The cap does not create the imbalance","Total capacity is ample; it is unevenly used","","Replicas never share cache blocks, salted or not"],"lo":["LO6"],"day":4,"session":2,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-lo6-scaling","type":"single","prompt":"A replica needs 8 minutes to start and the evening demand rises steeply. Which scaling signal keeps the worst hour above the objective at the lowest cost?","options":[{"key":"A","text":"Requests waiting in the queue"},{"key":"B","text":"The request rate, with headroom, and at least one replica"},{"key":"C","text":"A fixed number of replicas for the peak, all day"},{"key":"D","text":"The request rate with a minimum of zero replicas"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The rate rises before the queue does, and the headroom covers the minutes a new replica needs to start.","misconceptions":["Reacts only once visitors wait, then overshoots during the cold start","","Meets the objective at more than twice the cost","Leaves the first morning visitors waiting a whole cold start for almost no saving"],"lo":["LO6"],"day":4,"session":3,"slide":null,"level":"evaluate","pool":"practice"},{"id":"q-lo6-cost","type":"single","prompt":"Over a day the node costs 107 SAR and 40,000 requests met the objective; a hosted API would charge 0.00105 SAR per request. What is the node's cost per successful request, and which is cheaper?","options":[{"key":"A","text":"0.00268 SAR; the hosted API"},{"key":"B","text":"0.00268 SAR; the node"},{"key":"C","text":"0.000268 SAR; the node"},{"key":"D","text":"0.0268 SAR; the hosted API"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"107 / 40,000 = 0.00268 SAR per successful request, about 2.5 times the hosted price.","misconceptions":["","Computes correctly and compares the wrong way","Divides by ten times the requests","Divides by a tenth of the requests"],"lo":["LO6"],"day":4,"session":4,"slide":null,"level":"apply","pool":"practice"}]}</script>
